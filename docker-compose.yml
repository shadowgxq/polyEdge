services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3010}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://app:app@postgres:5432/app_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_PREFETCH_INTERVAL_SECONDS: ${MARKET_PREFETCH_INTERVAL_SECONDS:-30}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MARKET_PREFETCH_BATCH_LIMIT: ${MARKET_PREFETCH_BATCH_LIMIT:-100}
      EVENT_LIST_PAGE_SIZE: ${EVENT_LIST_PAGE_SIZE:-20}
      RANKING_TOP_N: ${RANKING_TOP_N:-10}
      EVENT_SEARCH_LIMIT: ${EVENT_SEARCH_LIMIT:-10}
      MARKET_REFRESH_THROTTLE_SECONDS: ${MARKET_REFRESH_THROTTLE_SECONDS:-30}
      REALTIME_RATE_LIMIT_WINDOW: ${REALTIME_RATE_LIMIT_WINDOW:-60}
      REALTIME_RATE_LIMIT_MAX: ${REALTIME_RATE_LIMIT_MAX:-30}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
